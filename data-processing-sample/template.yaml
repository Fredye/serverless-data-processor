AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sample SQS data processor using the data-processing-framework Lambda layer with PostgreSQL persistence.

Parameters:
  DataProcessingLayerArn:
    Type: String
    Description: Version ARN output by the data-processing-layer stack.
  DatabaseHost:
    Type: String
    Description: RDS/Aurora PostgreSQL endpoint hostname.
  DatabasePort:
    Type: Number
    Default: 5432
    Description: RDS/Aurora PostgreSQL endpoint port.
  DatabaseName:
    Type: String
    Description: Database that contains the processed_transactions table.
  DatabaseUser:
    Type: String
    Description: Database user used by the Lambda function.
  DatabasePassword:
    Type: String
    NoEcho: true
    Description: Password for DatabaseUser. Prefer AWS Secrets Manager in production.
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Subnets for Lambda VPC access to RDS. Leave empty when the database is publicly reachable.
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Security groups granting the function outbound access to RDS.

Conditions:
  UseVpc: !Not [!Equals [!Join ['', !Ref VpcSubnetIds], '']]

Resources:
  ProcessingDlq:
    Type: AWS::SQS::Queue

  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProcessingDlq.Arn
        maxReceiveCount: 3

  IdempotencyLedger:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH

  JobRuns:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  TransactionProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref DataProcessingLayerArn
      VpcConfig:
        Fn::If:
          - UseVpc
          - SubnetIds: !Ref VpcSubnetIds
            SecurityGroupIds: !Ref VpcSecurityGroupIds
          - !Ref AWS::NoValue
      Environment:
        Variables:
          IDEMPOTENCY_TABLE: !Ref IdempotencyLedger
          JOB_RUNS_TABLE: !Ref JobRuns
          DB_HOST: !Ref DatabaseHost
          DB_PORT: !Ref DatabasePort
          DB_NAME: !Ref DatabaseName
          DB_USER: !Ref DatabaseUser
          DB_PASSWORD: !Ref DatabasePassword
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyLedger
        - DynamoDBCrudPolicy:
            TableName: !Ref JobRuns
      Events:
        QueueMessage:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessingQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  QueueUrl:
    Value: !Ref ProcessingQueue
  FunctionName:
    Value: !Ref TransactionProcessorFunction
